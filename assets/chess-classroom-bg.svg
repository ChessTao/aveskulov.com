<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Quiet chess study background with correct empty boards">
  <defs>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0e7d8"/>
      <stop offset="0.58" stop-color="#dfd0bb"/>
      <stop offset="1" stop-color="#c4a98b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9a6b42"/>
      <stop offset="0.52" stop-color="#7a4f31"/>
      <stop offset="1" stop-color="#57371f"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2a604d"/>
      <stop offset="1" stop-color="#173d31"/>
