    <rect x="820" y="166" width="150" height="82" fill="#261d16" opacity="0.56"/>
    <rect x="820" y="278" width="150" height="82" fill="#261d16" opacity="0.52"/>
    <rect x="820" y="390" width="150" height="82" fill="#261d16" opacity="0.52"/>
    <rect x="820" y="502" width="150" height="82" fill="#261d16" opacity="0.48"/>
    <g fill="#caa46d" opacity="0.68">
