    <use href="#empty-board" x="330" y="690" width="225" height="225" opacity="0.92"/>
    <rect x="210" y="750" width="96" height="42" rx="7" fill="#1f1d19" opacity="0.72"/>
    <rect x="575" y="740" width="78" height="104" fill="#fff8ec" opacity="0.68"/>
