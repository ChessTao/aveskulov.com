  <g opacity="0.12" stroke="#4f3521" stroke-width="3">
    <path d="M0 905h1920M0 980h1920M0 1055h1920"/>
    <path d="M120 535v545M300 535v545M480 535v545M660 535v545M840 535v545M1020 535v545M1200 535v545M1380 535v545M1560 535v545M1740 535v545"/>
