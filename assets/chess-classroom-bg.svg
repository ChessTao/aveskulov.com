        <rect x="37.5" y="37.5" width="27.5" height="27.5"/><rect x="92.5" y="37.5" width="27.5" height="27.5"/><rect x="147.5" y="37.5" width="27.5" height="27.5"/><rect x="202.5" y="37.5" width="27.5" height="27.5"/>
        <rect x="10" y="65" width="27.5" height="27.5"/><rect x="65" y="65" width="27.5" height="27.5"/><rect x="120" y="65" width="27.5" height="27.5"/><rect x="175" y="65" width="27.5" height="27.5"/>
        <rect x="37.5" y="92.5" width="27.5" height="27.5"/><rect x="92.5" y="92.5" width="27.5" height="27.5"/><rect x="147.5" y="92.5" width="27.5" height="27.5"/><rect x="202.5" y="92.5" width="27.5" height="27.5"/>
        <rect x="10" y="120" width="27.5" height="27.5"/><rect x="65" y="120" width="27.5" height="27.5"/><rect x="120" y="120" width="27.5" height="27.5"/><rect x="175" y="120" width="27.5" height="27.5"/>
        <rect x="37.5" y="147.5" width="27.5" height="27.5"/><rect x="92.5" y="147.5" width="27.5" height="27.5"/><rect x="147.5" y="147.5" width="27.5" height="27.5"/><rect x="202.5" y="147.5" width="27.5" height="27.5"/>
        <rect x="10" y="175" width="27.5" height="27.5"/><rect x="65" y="175" width="27.5" height="27.5"/><rect x="120" y="175" width="27.5" height="27.5"/><rect x="175" y="175" width="27.5" height="27.5"/>
        <rect x="37.5" y="202.5" width="27.5" height="27.5"/><rect x="92.5" y="202.5" width="27.5" height="27.5"/><rect x="147.5" y="202.5" width="27.5" height="27.5"/><rect x="202.5" y="202.5" width="27.5" height="27.5"/>
