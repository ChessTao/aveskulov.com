      <rect x="838" y="292" width="12" height="56"/><rect x="866" y="286" width="10" height="62"/><rect x="894" y="299" width="12" height="49"/><rect x="924" y="291" width="11" height="57"/>
      <rect x="846" y="405" width="12" height="54"/><rect x="874" y="398" width="11" height="61"/><rect x="905" y="410" width="12" height="49"/><rect x="936" y="404" width="10" height="55"/>
    </g>
